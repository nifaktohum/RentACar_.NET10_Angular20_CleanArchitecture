<!-- modules/admin/vehicle-types/pages/vehicle-types/vehicle-type-dialog/vehicle-type-dialog.component.html -->

<p-dialog [header]="dialogTitle" [visible]="visible()" (visibleChange)="closeDialog()" [modal]="true"
  [style]="{ width: '500px', maxWidth: '95vw' }" [draggable]="false" [resizable]="false" [closable]="!isSaving()"
  class="vehicle-type-dialog">

  <!-- @if (isLoading()) {
  <div class="loading-state">
    <i class="ri-loader-4-line spin"></i>
    <span>Yükleniyor...</span>
  </div>
  } -->

  <div class="vehicle-type-form">
    <!-- Temel Bilgiler -->
    <div class="form-section">
      <h4>Temel Bilgiler</h4>

      <div class="form-row">
        <div class="form-field full-width">
          <label for="name">Tip Adı <span class="required">*</span></label>
          <input id="name" pInputText [(ngModel)]="formData.name" placeholder="Örn: Sedan, SUV, Hatchback"
            [disabled]="isSaving() || isLoading()" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field full-width">
          <label for="description">Açıklama</label>
          <textarea id="description" pInputTextarea [(ngModel)]="formData.description" rows="2"
            placeholder="Araç tipi açıklaması (opsiyonel)" [disabled]="isSaving() || isLoading()"></textarea>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="icon">İkon</label>
          <input id="icon" pInputText [(ngModel)]="formData.icon" placeholder="Örn: ri-car-line"
            [disabled]="isSaving() || isLoading()" />
          <small class="field-hint">Remix Icon kodu (opsiyonel)</small>
        </div>
        <div class="form-field">
          <label for="displayOrder">Sıralama</label>
          <input id="displayOrder" pInputText type="number" [(ngModel)]="formData.displayOrder"
            placeholder="0, 1, 2, ..." [disabled]="isSaving() || isLoading()" />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button pButton label="İptal" icon="ri-close-line" class="p-button-text" (click)="closeDialog()"
        [disabled]="isSaving() || isLoading()"></button>
      <button pButton label="Kaydet" icon="ri-save-line" class="p-button-primary" [loading]="isSaving()"
        (click)="saveVehicleType()" [disabled]="isLoading()"></button>
    </div>
  </div>
</p-dialog>
